services:
  # Own tailnet node for Vesper, independent of the host's own tailnet
  # identity — so nothing else on the host calling `tailscale serve` can
  # hijack Vesper's URL again. Publishes as https://vesper.<tailnet>.ts.net.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: vesper
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ts-vesper-state:/var/lib/tailscale
      - ./ops/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      # Bind only to localhost — LAN/router access is unchanged from before;
      # the new tailnet URL is a second entry point, not a replacement.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  vesper:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist:ro   # served read-only
      - whisper-cache:/root/.cache/huggingface
      # Obsidian vault mirror — Vesper writes each finished transcript (+ audio)
      # into Recordings/<date>/ so the memoir pipeline keeps its source material.
      # Writable on purpose; scoped to that one folder, not the whole vault.
      # Host folder comes from VESPER_VAULT_DIR in the root .env (see .env.example).
      - "${VESPER_VAULT_DIR:?set VESPER_VAULT_DIR in .env}:/vault/recordings"
    env_file:
      - backend/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # --- Liveness: Docker + the Windows watchdog both probe /health ---
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 600s   # first boot downloads model weights (~800MB)

    # --- Hardening ---
    security_opt:
      - no-new-privileges:true   # block privilege escalation (setuid, etc.)
    # Drop all Linux capabilities — strong defense-in-depth. Opt-in because a
    # few GPU stacks misbehave without caps; enable, then confirm a recording
    # still transcribes. Most CUDA setups are fine with this on.
    # cap_drop:
    #   - ALL
    mem_limit: 8g          # ceiling; lower toward ~75% of your WSL2 RAM if needed
    pids_limit: 512        # fork-bomb guard
    # cpus: "4.0"          # uncomment to cap CPU cores used for audio decode

    logging:
      driver: json-file
      options:
        max-size: "10m"    # rotate logs so they can't fill the disk
        max-file: "3"

    restart: unless-stopped

volumes:
  ts-vesper-state:
  whisper-cache:

